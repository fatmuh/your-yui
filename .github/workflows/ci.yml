name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22.19
        uses: actions/setup-node@v4
        with:
          node-version: 22.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
